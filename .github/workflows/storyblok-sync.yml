name: Storyblok Sync

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:           # manual trigger from GitHub Actions UI
  repository_dispatch:
    types: [storyblok_published]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Storyblok sync
        env:
          SB_TOKEN: ${{ secrets.SB_TOKEN }}
        run: python scripts/sync_storyblok.py

      - name: Commit changes
        run: |
          git config user.email "storyblok-sync@github.com"
          git config user.name "Storyblok Sync"
          git add -A
          git diff --staged --quiet || git commit -m "sync: content update from Storyblok [skip ci]"
          git push
