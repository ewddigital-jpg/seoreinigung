name: Storyblok Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [storyblok_published]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Storyblok sync
        env:
          SB_TOKEN: ${{ secrets.SB_TOKEN }}
        run: python scripts/sync_storyblok.py

      - name: Commit and push if changed
        run: |
          git config user.email "storyblok-sync@github.com"
          git config user.name "Storyblok Sync"
          git add -A
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "sync: content update from Storyblok [skip ci]"
          git push
