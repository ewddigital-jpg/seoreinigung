<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.K. Reinigung - Admin</title>
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  <script>
  CMS.init({
    config: {
      backend: {
        name: 'github',
        repo: 'ewddigital-jpg/seoreinigung',
        branch: 'main',
        auth_type: 'pkce',
        app_id: 'Ov23likqSPjBdBGG6qME'
      },
      media_folder: '.',
      public_folder: '/',
      locale: 'de',
      collections: [
        {
          name: 'seiten',
          label: 'Seiten',
          files: [
            { name: 'index', label: 'Startseite', file: 'index.html', fields: [{ label: 'Inhalt', name: 'body', widget: 'text' }] },
            { name: 'leistungen', label: 'Leistungen', file: 'leistungen.html', fields: [{ label: 'Inhalt', name: 'body', widget: 'text' }] },
            { name: 'kontakt', label: 'Kontakt', file: 'kontakt.html', fields: [{ label: 'Inhalt', name: 'body', widget: 'text' }] },
            { name: 'ueber-uns', label: 'Ueber uns', file: 'ueber-uns.html', fields: [{ label: 'Inhalt', name: 'body', widget: 'text' }] },
            { name: 'faq', label: 'FAQ', file: 'faq.html', fields: [{ label: 'Inhalt', name: 'body', widget: 'text' }] }
          ]
        }
      ]
    }
  });
  </script>
</body>
</html>
