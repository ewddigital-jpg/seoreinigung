<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.K. Reinigung - Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login{background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.1);width:340px;text-align:center}
.login h1{font-size:1.3rem;color:#1a3a5c;margin-bottom:6px}
.login p{font-size:.85rem;color:#64748b;margin-bottom:24px}
.login input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:8px;font-size:1rem;margin-bottom:10px;outline:none}
.login input:focus{border-color:#1a3a5c}
.hint{font-size:.75rem;color:#94a3b8;margin-bottom:12px;text-align:left}
.btn{width:100%;padding:12px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600}
.btn:hover{background:#234d79}
.login-err{color:#e63946;font-size:.85rem;margin-top:10px;display:none}
.admin{display:none;max-width:900px;margin:0 auto;padding:24px}
.admin-header{background:#1a3a5c;color:#fff;padding:16px 24px;border-radius:12px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between}
.admin-header h1{font-size:1.1rem}
.page-list{display:grid;gap:12px;margin-bottom:24px}
.page-btn{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 20px;cursor:pointer;text-align:left;font-size:.95rem;color:#1a3a5c;font-weight:600;transition:all .2s}
.page-btn:hover{border-color:#1a3a5c;box-shadow:0 2px 8px rgba(26,58,92,.1)}
.editor-panel{background:#fff;border-radius:12px;padding:24px;display:none}
.editor-panel h2{font-size:1rem;color:#1a3a5c;margin-bottom:16px}
textarea{width:100%;height:440px;font-family:monospace;font-size:.78rem;padding:12px;border:1px solid #e2e8f0;border-radius:8px;resize:vertical;outline:none;line-height:1.5}
textarea:focus{border-color:#1a3a5c}
.editor-actions{display:flex;gap:10px;margin-top:12px}
.btn-save{padding:10px 24px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn-cancel{padding:10px 24px;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;font-size:.9rem}
.status{font-size:.85rem;margin-top:8px;padding:8px 12px;border-radius:6px;display:none}
.status.ok{background:#dcfce7;color:#166534;display:block}
.status.bad{background:#fee2e2;color:#991b1b;display:block}
.loading{color:#64748b;font-size:.85rem;padding:20px 0}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <h1>K.K. Reinigung</h1>
  <p>Admin-Bereich</p>
  <input type="password" id="pwInput" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()">
  <input type="password" id="tokenInput" placeholder="GitHub Access Token" onkeydown="if(event.key==='Enter')doLogin()">
  <p class="hint">Token: github.com/settings/tokens (repo Schreibrecht)</p>
  <button class="btn" onclick="doLogin()">Einloggen</button>
  <div class="login-err" id="loginErr">Falsches Passwort oder Token ungueltig</div>
</div>

<div class="admin" id="adminBox">
  <div class="admin-header">
    <h1>K.K. Reinigung - Seiten bearbeiten</h1>
    <button onclick="logout()" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem">Abmelden</button>
  </div>
  <div class="page-list">
    <button class="page-btn" onclick="loadPage('index.html','Startseite')">Startseite</button>
    <button class="page-btn" onclick="loadPage('leistungen.html','Leistungen')">Leistungen</button>
    <button class="page-btn" onclick="loadPage('kontakt.html','Kontakt')">Kontakt</button>
    <button class="page-btn" onclick="loadPage('ueber-uns.html','Ueber uns')">Ueber uns</button>
    <button class="page-btn" onclick="loadPage('faq.html','FAQ')">FAQ</button>
  </div>
  <div class="editor-panel" id="editorPanel">
    <h2 id="editorTitle"></h2>
    <div class="loading" id="loadingMsg">Lade Inhalt...</div>
    <textarea id="editor" style="display:none"></textarea>
    <div class="editor-actions" id="editorActions" style="display:none">
      <button class="btn-save" onclick="savePage()">Speichern</button>
      <button class="btn-cancel" onclick="closeEditor()">Abbrechen</button>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>
</div>

<script>
var PW = 'kkreinigung2026';
var GH_TOKEN = '';
var API = 'https://api.github.com/repos/ewddigital-jpg/seoreinigung/contents/';
var currentFile = null, currentSha = null;

function doLogin() {
  var pw = document.getElementById('pwInput').value;
  var tok = document.getElementById('tokenInput').value.trim();
  if (pw !== PW || !tok) {
    document.getElementById('loginErr').style.display = 'block';
    return;
  }
  // Verify token works
  fetch(API + 'index.html', {headers: {'Authorization': 'token ' + tok}})
    .then(function(r) {
      if (r.status === 200) {
        GH_TOKEN = tok;
        document.getElementById('loginBox').style.display = 'none';
        document.body.style.alignItems = 'flex-start';
        document.getElementById('adminBox').style.display = 'block';
      } else {
        document.getElementById('loginErr').style.display = 'block';
      }
    })
    .catch(function() {
      document.getElementById('loginErr').style.display = 'block';
    });
}

function logout() {
  GH_TOKEN = '';
  document.getElementById('adminBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.body.style.alignItems = 'center';
  document.getElementById('pwInput').value = '';
  document.getElementById('tokenInput').value = '';
  closeEditor();
}

function loadPage(file, label) {
  currentFile = file;
  document.getElementById('editorTitle').textContent = label + ' bearbeiten';
  document.getElementById('editorPanel').style.display = 'block';
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('editor').style.display = 'none';
  document.getElementById('editorActions').style.display = 'none';
  document.getElementById('saveStatus').className = 'status';

  fetch(API + file, {headers: {'Authorization': 'token ' + GH_TOKEN}})
    .then(function(r){ return r.json(); })
    .then(function(d) {
      currentSha = d.sha;
      document.getElementById('editor').value = decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('editor').style.display = 'block';
      document.getElementById('editorActions').style.display = 'flex';
    })
    .catch(function() {
      document.getElementById('loadingMsg').textContent = 'Fehler beim Laden.';
    });
}

function savePage() {
  var content = document.getElementById('editor').value;
  var status = document.getElementById('saveStatus');
  status.className = 'status';
  status.textContent = 'Speichert...';
  status.style.display = 'block';

  fetch(API + currentFile, {
    method: 'PUT',
    headers: {'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json'},
    body: JSON.stringify({message: 'Admin: update ' + currentFile, content: btoa(unescape(encodeURIComponent(content))), sha: currentSha})
  })
  .then(function(r){ return r.json(); })
  .then(function(d) {
    if (d.content) {
      currentSha = d.content.sha;
      status.className = 'status ok';
      status.textContent = 'Gespeichert! Seite ist in ca. 60 Sekunden live.';
    } else {
      status.className = 'status bad';
      status.textContent = 'Fehler: ' + (d.message || 'unbekannt');
    }
  })
  .catch(function() {
    status.className = 'status bad';
    status.textContent = 'Netzwerkfehler beim Speichern.';
  });
}

function closeEditor() {
  document.getElementById('editorPanel').style.display = 'none';
  currentFile = null;
  currentSha = null;
}
</script>
</body>
</html>
